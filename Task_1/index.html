<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
</head>

<body>

<table width="100%">
<tr>

<td width="50%" align="center">
<img src="/seesion_1/task_1/images/22.jpeg" width="520" alt="Doctor">
</td>

<td>
<h1>Doctor Appointment Form</h1>

<hr color="red">

<form>

  <table cellpadding="8">

      <tr>
          <td>Appointment<br>Date</td>
          <td>
              <input type="date">
          </td>
      </tr>

      <tr>
          <td>Appointment<br>Time</td>
          <td>
              <input type="time">
          </td>
      </tr>

      <tr>
          <td>Name</td>
          <td>
              <input type="text" placeholder="First">
              <input type="text" placeholder="Last">
          </td>
      </tr>

      <tr>
          <td>Gender</td>
          <td>
              <input type="radio" name="gender">
              Male

              <input type="radio" name="gender" checked>
              Female
          </td>
      </tr>

      <tr>
          <td>Phone</td>
          <td>
              <input type="text" placeholder="####">
          </td>
      </tr>

      <tr>
          <td>Address</td>
          <td>
              <input type="text" placeholder="city">
              <input type="text" placeholder="state">
          </td>
      </tr>

      <tr>
          <td>Your Query</td>
          <td>
              <textarea rows="4" cols="35"></textarea>
          </td>
      </tr>

      <tr>
          <td>Appointment<br>Type</td>
          <td>
              Select which appointment type(s) you require
              <br>

              <input type="checkbox" checked>
              Cervix checkup
              <br>

              <input type="checkbox" checked>
              Heart checkup
              <br>

              <input type="checkbox">
              Eye check-up
              <br>

              <input type="checkbox">
              Hearing Test
          </td>
      </tr>

      <tr>
          <td></td>
          <td>
              <input type="submit" value="Send">
          </td>
      </tr>

  </table>

</form>

</td>

</tr>
</table>

</body>
</html>
